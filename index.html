<!DOCTYPE html>
<html lang="en">

    <title>PETcom</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main>

        <div id="subscribe">

            <h1 class="tittle">Se inscreva no PETcom:</h1>

            <form id="form">

                <label for="name">Nome</label>
                <input id="name" type="text" required>
                
                <label for="age">idade</label>
                <input id="age" type="number" required>

                <label for="petName">Nome do seu PET</label>
                <input id="petName" type="text" required>

                <label for="petType">Que tipo de pet você tem</label>
                <input id="petType" type="text" placeholder="ex: cachorro, gato..." required>

                <button id="submit" type="submit">Enviar</button>

            </form>

        </div>

        <div id="data">
            
            <h2>Comunidade PETcom</h2>

            <ul id="registrations"></ul>

        </div>

    </main>
    
    <script type="module" src="./main.js"></script>
